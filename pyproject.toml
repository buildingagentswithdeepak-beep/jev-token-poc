[project]
name = "tokenpoc"
version = "0.1.0"
description = "POC: measuring Copilot frontier-model token reduction via Jev-delegated decisioning (SPEC v1.1)"
requires-python = ">=3.11"
dependencies = [
    "github-copilot-sdk==1.0.23",
    "typer",
    "pydantic>=2",
    "rich",
    "python-dotenv",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
tokenpoc = "tokenpoc.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["tokenpoc*"]

[tool.setuptools.package-data]
tokenpoc = ["prompts/*.txt", "prompts/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
